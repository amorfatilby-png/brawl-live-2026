# Render Blueprint: Node.js 服务（支持 /api/state）
services:
  - type: web
    name: brawl-live-2026
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FEED_PROVIDER
        value: supercell
      - key: FEED_INTERVAL_MS
        value: "60000"
      # 官方网页源无需 Token；不要同时配置 FEED_URL
      # 如使用管理员功能，在 Render 面板添加 ADMIN_KEY，切勿提交到 GitHub
