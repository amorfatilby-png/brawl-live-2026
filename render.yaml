# Render Blueprint: Node.js 服务（支持 /api/state）
services:
  - type: web
    name: brawl-live-2026
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # 获得授权的赛事 JSON 地址后再在 Render 面板添加 FEED_URL / FEED_TOKEN
      # 如使用管理员功能，在 Render 面板添加 ADMIN_KEY，切勿提交到 GitHub
